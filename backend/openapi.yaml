openapi: 3.0.3
info:
  title: Station Finder API
  version: 1.0.0
  description: |
    Ranks vacancy stations by road distance / travel time from a starting point.
    Several lists can be loaded (see data/lists.json); pick one with `list`.
    On Choreo the gateway exposes only the resources listed here, so every new
    endpoint must be added to this file. The write operations (tagged "admin")
    are admin-only: with the built-in sign-in (Docker) the server enforces this,
    on Choreo attach an admin permission in Operation Level Security.
servers:
  - url: /
tags:
  - name: search
  - name: stations
  - name: admin
    description: Changes shared data. Restrict to administrators.
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        "200": { description: OK }
  /api/meta:
    get:
      tags: [search]
      summary: Available lists, plus counts and filter options for one list
      parameters:
        - $ref: "#/components/parameters/List"
      responses:
        "200": { description: OK }
        "400": { description: Unknown list }
  /api/search:
    post:
      tags: [search]
      summary: Find stations near a starting point
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200": { description: Ranked stations }
        "400": { description: Invalid request }
        "502": { description: Google API error }
  /api/places/autocomplete:
    get:
      tags: [search]
      summary: Place suggestions (Google) and matching stations
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: session, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: Suggestions }
  /api/places/details:
    get:
      tags: [search]
      summary: Coordinates of a suggested place
      parameters:
        - { name: placeId, in: query, required: true, schema: { type: string } }
        - { name: session, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: Place }
        "400": { description: Missing placeId or place outside Sri Lanka }
  /api/stations:
    get:
      tags: [stations]
      summary: The stations of one list with their location entries
      parameters:
        - $ref: "#/components/parameters/List"
      responses:
        "200": { description: Stations }
        "400": { description: Unknown list }
  /api/geocode/status:
    get:
      tags: [stations]
      summary: Geocoding progress
      responses:
        "200": { description: Progress }
  /api/stations/{id}/location:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [admin]
      summary: Set a station's location manually
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LatLng" }
      responses:
        "200": { description: Updated }
        "400": { description: Invalid location }
        "404": { description: Unknown station }
    delete:
      tags: [admin]
      summary: Remove a manual location
      responses:
        "200": { description: Removed }
  /api/geocode:
    post:
      tags: [admin]
      summary: Locate missing stations (calls Google)
      parameters:
        - { name: retryFailed, in: query, required: false, schema: { type: boolean } }
      responses:
        "202": { description: Started }
        "409": { description: Already running }
components:
  parameters:
    List:
      name: list
      in: query
      required: false
      description: List id from /api/meta `lists` (default = the first list)
      schema: { type: string }
  schemas:
    LatLng:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number }
        lng: { type: number }
    SearchRequest:
      type: object
      required: [origin]
      properties:
        list: { type: string, description: "List id (default = the first list)" }
        origin:
          type: object
          properties:
            query: { type: string }
            lat: { type: number }
            lng: { type: number }
            label: { type: string }
        maxDistanceKm: { type: number }
        maxDurationMin: { type: number }
        limit: { type: integer }
        sortBy: { type: string, enum: [duration, distance, straight] }
        provinces: { type: array, items: { type: string } }
        districts: { type: array, items: { type: string } }
        types: { type: array, items: { type: string } }
        categories: { type: array, items: { type: string } }
        designation: { type: string }
        difficultOnly: { type: boolean, description: "Only stations on the difficult stations list" }
