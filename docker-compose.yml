# Station Finder on a VPS: the app plus Caddy for HTTPS (automatic Let's Encrypt).
#
#   cp .env.example .env              # Google key, DOMAIN and the Keycloak client settings
#   docker compose up -d --build
#
# See README → "Deploy on a VPS with Docker".
services:
  app:
    build: .
    image: station-finder:latest
    restart: unless-stopped
    environment:
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:?set GOOGLE_MAPS_API_KEY in .env}
      # Sign-in with Keycloak (docs/keycloak.md). Leave OIDC_ISSUER empty to run without sign-in.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-station-finder}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ADMIN_ROLE: ${OIDC_ADMIN_ROLE:-admin}
      OIDC_REQUIRED_ROLE: ${OIDC_REQUIRED_ROLE:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      STATE_DIR: /data
    volumes:
      - app-data:/data                                  # locations, fixes, session key
    # Not published: only Caddy reaches it. For a quick test without Caddy, add
    #   ports: ["8080:8080"]
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "/app/stationfinder", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Your domain (DNS A record pointing at this server) for automatic HTTPS,
      # or ":80" to serve plain HTTP on the server's IP.
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (a domain name, or :80)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data                                # certificates
      - caddy-config:/config

volumes:
  app-data:
  caddy-data:
  caddy-config:
