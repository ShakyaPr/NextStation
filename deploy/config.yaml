# Configuration baked into the Docker image (see Dockerfile).
# Secrets are NOT stored here; they come from environment variables:
#   GOOGLE_MAPS_API_KEY   Google key (required)
#   OIDC_ISSUER, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET, PUBLIC_URL
#                         sign-in with Keycloak (recommended on a VPS; docs/keycloak.md)
#   OIDC_ADMIN_ROLE, OIDC_REQUIRED_ROLE   optional role names
#   SESSION_SECRET        optional; otherwise a key is generated in the state directory
#   STATE_DIR             where writable files go (docker-compose.yml sets /data, a volume)
#   PORT, CONFIG_FILE     also honoured

server:
  port: 8080
  # The built UI is in the image, so one container serves the app and the API.
  staticDir: /app/static

google:
  apiKey: ""
  usePlacesSearch: true
  travelMode: DRIVE

data:
  # The vacancy / station lists shown in the app's list picker.
  listsFile: /app/data/lists.json
  # Writable copies. By default they live in /tmp (the only writable path on Choreo)
  # and are lost when the container is replaced; STATE_DIR=/data with a volume keeps
  # them. They start from - and are merged with - the seeds baked into the image.
  geocacheFile: /tmp/stationfinder/geocache.json
  geocacheSeedFile: /app/data/geocache.json
  overridesFile: /tmp/stationfinder/overrides.json
  overridesSeedFile: /app/data/overrides.json

search:
  defaultLimit: 10
  maxRouteCandidates: 60
  maxSpeedKmh: 80
  suspectDistanceKm: 75

geocoding:
  onStartup: true   # only stations missing from the seed / state are looked up

auth:
  # issuer, clientId, clientSecret and publicUrl come from the OIDC_* / PUBLIC_URL env vars.
  clientId: station-finder
  adminRole: admin      # users with this role may fix station locations
  sessionHours: 12      # then the app checks with Keycloak again (silently if still signed in there)
