<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <!-- "Add to Home Screen" on iPhone opens it like an app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Stations" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Station Finder</title>
    <script>
      // Relative URLs need a trailing slash, e.g. /prefix/ rather than /prefix.
      if (!location.pathname.endsWith("/") && !/\.[a-z0-9]+$/i.test(location.pathname)) {
        location.replace(location.pathname + "/" + location.search + location.hash);
      }
    </script>
    <!-- Runtime config (API URL, managed auth). Replaced by a file mount on Choreo. -->
    <script src="./config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
